<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krishna Kushwaha, Video Editor</title>
<meta name="description" content="Krishna Kushwaha is a video editor with 2 years of experience editing reels and shorts.">
<meta name="theme-color" content="#050203">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#050203;
  --raised:#0e0709;
  --line:#2a1b1f;
  --text:#f6f1f1;
  --muted:#a89a9d;
  --accent:#ff1e3c;
  --accent-soft:rgba(255,30,60,.14);
  --accent-line:rgba(255,30,60,.4);
  --glow:rgba(255,30,60,.55);
  --fd:'Anton','Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@supports (color: color-mix(in srgb, red, blue)){
  :root{
    --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
    --accent-line:color-mix(in srgb,var(--accent) 40%,transparent);
    --glow:color-mix(in srgb,var(--accent) 55%,transparent);
  }
}
html{
  height:100%;
  background:var(--bg);
  scroll-behavior:smooth;
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--fb);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 45% at 90% -10%,var(--accent-soft),transparent 72%);
}
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
}
main,footer{position:relative;z-index:1}
.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}

/* ---------- Nav ---------- */
.nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:rgba(5,2,3,.72);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.01em;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow),0 0 26px var(--glow);flex:none}
.links{display:flex;gap:30px;color:var(--muted);font-size:15px;font-weight:500}
.links a{transition:color .2s}
.links a:hover{color:var(--text)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 28px;border-radius:999px;border:1px solid transparent;
  font-weight:700;font-size:16px;line-height:1.2;cursor:pointer;
  transition:transform .2s,box-shadow .25s,border-color .2s,color .2s,background .2s;
}
.btn-sm{padding:10px 20px;font-size:15px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 34px -10px var(--glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 26px var(--glow),0 12px 40px -8px var(--glow)}
.btn-ghost{border-color:rgba(255,255,255,.22);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Hero ---------- */
.hero{padding:clamp(40px,7vw,84px) 0 0}
.role{margin:0 0 6px;color:var(--muted);font-size:18px;font-weight:500}
.stage{
  --p:64%;
  position:relative;
  padding-top:44px;
  touch-action:pan-y;
  user-select:none;-webkit-user-select:none;
}
.flag{
  position:absolute;top:0;z-index:6;
  left:clamp(36px,var(--p),calc(100% - 36px));
  transform:translateX(-50%);
  background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  padding:6px 9px;border-radius:5px;
  box-shadow:0 0 18px var(--glow);
  pointer-events:none;
}
.playhead{
  position:absolute;top:0;bottom:0;z-index:5;
  left:var(--p);width:2px;margin-left:-1px;
  background:var(--accent);
  box-shadow:0 0 12px var(--glow),0 0 34px var(--glow);
  pointer-events:none;
}
.title{position:relative}
.name{
  font-family:var(--fd);font-weight:400;
  font-size:clamp(84px,19vw,264px);
  line-height:.92;letter-spacing:.005em;
  margin:0;
}
.name .ln{display:block}
.name.outline{
  color:transparent;
  -webkit-text-stroke:clamp(1.5px,.22vw,3px) var(--accent);
  filter:drop-shadow(0 0 14px var(--glow));
}
.name.solid{
  position:absolute;inset:0;color:#fff;pointer-events:none;
  clip-path:inset(0 calc(100% - var(--p)) 0 0);
}

.tl{position:relative;margin-top:30px;padding-top:12px;border-top:1px solid var(--line);outline-offset:6px}
.ruler{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-bottom:6px;
}
.ticks{
  height:8px;margin-bottom:8px;
  background-image:repeating-linear-gradient(90deg,#4a3238 0 1px,transparent 1px calc(100% / 30));
}
.track{display:flex;gap:4px;margin-top:6px}
.track.video{height:38px}
.track.audio{height:46px;align-items:center;gap:2px}
.track.caps{height:20px}
.clip{min-width:0;border-radius:4px}
.clip.a{background:#261017;box-shadow:inset 0 2px 0 var(--accent-line)}
.clip.b{background:#170b0f;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.bar{flex:1 1 0;min-width:1px;height:var(--h);background:#3b2429;border-radius:1px}
.bar.on{background:var(--accent)}
.cap{border-radius:3px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.gap{background:none}
.hint{margin:14px 0 0;color:var(--muted);font-size:14px}

.intro{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:28px 48px;margin-top:clamp(28px,4vw,48px);
}
.intro p{margin:0;max-width:34em;font-size:clamp(19px,2.1vw,24px);line-height:1.5}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- Sections ---------- */
.section{padding-top:clamp(84px,11vw,140px)}
.section:last-child{padding-bottom:0}
.h2{
  font-family:var(--fd);font-weight:400;
  font-size:clamp(46px,8vw,96px);line-height:.95;letter-spacing:.005em;
  margin:0;
}
.lead{margin:16px 0 0;color:var(--muted);max-width:34em;font-size:18px}

/* Work */
.filters{display:flex;flex-wrap:wrap;gap:6px 26px;margin:34px 0 26px}
.filter{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:6px 0;cursor:pointer;color:var(--muted);
  font-weight:600;font-size:16px;transition:color .2s,border-color .2s;
}
.filter:hover{color:var(--text)}
.filter[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{
  position:relative;display:block;isolation:isolate;overflow:hidden;
  aspect-ratio:9/16;border-radius:12px;
  background:#0c0608;border:1px solid var(--line);
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
a.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 0 34px -8px var(--glow)}
.art{position:absolute;inset:0;z-index:-2;background:var(--art)}
.art::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
}
.card::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(0,0,0,.88),transparent 58%);
}
.tag{
  position:absolute;top:12px;left:12px;
  padding:4px 10px;border-radius:999px;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-size:12px;font-weight:600;
}
.play{
  position:absolute;top:50%;left:50%;
  width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  display:grid;place-items:center;
  border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:background .25s,border-color .25s,box-shadow .25s;
}
.play svg{width:20px;height:20px;margin-left:3px}
a.card:hover .play{background:var(--accent);border-color:var(--accent);box-shadow:0 0 26px var(--glow)}
.info{position:absolute;left:14px;right:14px;bottom:22px}
.info b{display:block;font-size:16px;line-height:1.3;font-weight:600}
.info small{display:block;margin-top:2px;color:var(--muted);font-size:13px;line-height:1.4}
.bar-p{position:absolute;left:14px;right:14px;bottom:12px;height:2px;background:rgba(255,255,255,.22);border-radius:2px}
.bar-p::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--accent);box-shadow:0 0 8px var(--glow);border-radius:2px}

/* Services + contact rows */
.rows{margin-top:44px;border-top:1px solid var(--line)}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 40px;
  padding:26px 0;border-bottom:1px solid var(--line);align-items:baseline;
}
.row h3{margin:0;font-size:clamp(21px,2.6vw,28px);line-height:1.2;font-weight:600}
.row p{margin:0;color:var(--muted);max-width:44ch}
a.row{transition:color .2s,padding .25s}
a.row h3{transition:color .2s}
a.row:hover h3{color:var(--accent)}
a.row:hover{padding-left:10px}
.row .val{color:var(--muted);font-size:18px;overflow-wrap:anywhere}
@media (max-width:719px){.row{grid-template-columns:1fr}}

/* About */
.about-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px 72px;margin-top:44px;align-items:start}
.about-grid p{margin:0;font-size:clamp(20px,2.2vw,26px);line-height:1.5}
.photo{margin:0 0 28px;max-width:340px}
.photo img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
dl{margin:0;border-top:1px solid var(--line)}
.fact{display:flex;justify-content:space-between;gap:24px;padding:16px 0;border-bottom:1px solid var(--line)}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;text-align:right}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}}

/* Footer */
.foot{
  margin-top:clamp(84px,11vw,140px);padding:26px 0 40px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  color:var(--muted);font-size:15px;
}
.foot a:hover{color:var(--accent)}

@media (max-width:760px){.links{display:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top"><i class="dot"></i><span id="brandName"></span></a>
    <nav class="links" aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
    </nav>
    <a class="btn btn-primary btn-sm" href="#contact">Hire me</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <p class="role" id="role"></p>

      <div class="stage" id="stage">
        <span class="flag" id="flag">00:00:00</span>
        <div class="playhead" aria-hidden="true"></div>
        <div class="title">
          <h1 class="name outline" id="nameOutline"></h1>
          <div class="name solid" id="nameSolid" aria-hidden="true"></div>
        </div>
        <div class="tl" id="tl" tabindex="0" role="slider" aria-label="Scrub the timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
          <div class="ruler" id="ruler"></div>
          <div class="ticks" aria-hidden="true"></div>
          <div class="track video" id="tV"></div>
          <div class="track audio" id="tA"></div>
          <div class="track caps" id="tC"></div>
        </div>
      </div>
      <p class="hint" id="hint"></p>

      <div class="intro">
        <p id="intro"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#work">See my work</a>
          <a class="btn btn-ghost" href="#contact">Contact me</a>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="work">
    <div class="wrap">
      <h2 class="h2" id="workTitle"></h2>
      <p class="lead" id="workLead"></p>
      <div class="filters" id="filters" role="group" aria-label="Filter work"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="section" id="services">
    <div class="wrap">
      <h2 class="h2" id="servicesTitle"></h2>
      <p class="lead" id="servicesLead"></p>
      <div class="rows" id="serviceRows"></div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="wrap">
      <h2 class="h2" id="aboutTitle"></h2>
      <div class="about-grid">
        <div id="aboutMain"></div>
        <dl id="facts"></dl>
      </div>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="wrap">
      <h2 class="h2" id="contactTitle"></h2>
      <p class="lead" id="contactLead"></p>
      <div class="rows" id="contactRows"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span id="copy"></span>
    <a href="#top">Back to top</a>
  </div>
</footer>

<script>
/* =====================================================================
   CUSTOMIZE HERE
   Everything on the site comes from this one block. Change the text,
   the accent color, the projects, the links. Save, and the page updates.
   ===================================================================== */
const CONFIG = {
  name: "Krishna Kushwaha",
  role: "Video editor for reels and shorts",
  intro: "I'm a video editor with 2 years of experience, cutting reels and shorts that are made to hold attention from the first second.",
  hint: "Move across the timeline to scrub. On a phone, drag.",

  // The neon color used across the whole site. Try #ff0033, #ff2d55, #ff3b30
  accent: "#ff1e3c",

  // Your work. Add as many as you want. "link" opens when someone taps the poster
  // (YouTube, Instagram reel, Drive link). Leave link empty to show it without a link.
  // category creates the filter tabs automatically.
  work: {
    title: "Work",
    lead: "Recent reels and shorts. Tap a poster to watch.",
    projects: [
      { title: "Real Estate Reel",     category: "Real Estate", meta: "Real estate edit",    link: "https://youtube.com/shorts/frbXdxEJKBQ" },
      { title: "Real Estate Reel",     category: "Real Estate", meta: "Real estate edit",    link: "https://youtube.com/shorts/pWALUS18koU" },
      { title: "Business Talking Head",category: "Talking Head",meta: "Business content",    link: "https://youtube.com/shorts/Dd4mKHoNbPc" },
      { title: "Reel Edit",            category: "Reels",       meta: "Intermediate edit",   link: "https://youtube.com/shorts/SSE2-dI6JJs" },
      { title: "Tech Talking Head",    category: "Talking Head",meta: "Tech content",        link: "https://youtube.com/shorts/iLX09ZknFe8" },
      { title: "Tech Content Edit",    category: "Tech",        meta: "Tech content edit",   link: "https://youtube.com/shorts/EWWlSY25Ye0" },
      { title: "Astrology Ad",         category: "Ads",         meta: "Astrology based ad",  link: "https://youtube.com/shorts/TiCz5XkFHnk" }
    ]
  },

  services: {
    title: "What I do",
    lead: "From raw footage to a finished vertical video.",
    items: [
      { name: "Reels editing",            text: "Fast, vertical-first cuts built for Instagram." },
      { name: "YouTube Shorts",           text: "Tight edits that land inside the first seconds." },
      { name: "Captions and subtitles",   text: "Clean text that keeps sound-off viewers watching." },
      { name: "Color grading",            text: "One consistent look across every clip." },
      { name: "Transitions and effects",  text: "Smooth motion that supports the story." },
      { name: "Music and beat sync",      text: "Cuts timed to the track." }
    ]
  },

  about: {
    title: "About",
    // Optional photo. Remote image links do not work on the hosted page,
    // so this must be an embedded data:image/... string. Leave empty for no photo.
    photo: "",
    text: "I'm Krishna, a video editor with two years of experience. I edit reels and shorts, and I care most about how the first second lands: the hook, the pacing, and the cut that keeps someone watching.",
    facts: [
      ["Experience", "2 years"],
      ["Focus", "Reels and shorts"],
      ["Format", "Vertical 9:16"]
    ]
  },

  contact: {
    title: "Send me your footage.",
    lead: "Tell me what you're making and I'll get back to you.",
    // Rows with an empty url are hidden. Add or remove rows freely.
    links: [
      { label: "Email",     value: "heykrishna.in@gmail.com", url: "mailto:heykrishna.in@gmail.com" },
      { label: "WhatsApp",  value: "+91 74095 06414",         url: "https://wa.me/917409506414" },
      { label: "Instagram", value: "@yourhandle",             url: "" },
      { label: "YouTube",   value: "",                        url: "" }
    ]
  }
};
/* ===================== end of customization ===================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = String(u || "").trim(); return /^(https?:|mailto:|tel:)/i.test(u) ? u : ""; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- basics ---- */
document.documentElement.style.setProperty('--accent', CONFIG.accent);
document.title = CONFIG.name + ", Video Editor";
$('#brandName').textContent = CONFIG.name;
$('#role').textContent = CONFIG.role;
$('#intro').textContent = CONFIG.intro;
$('#hint').textContent = CONFIG.hint;
$('#copy').textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;

/* ---- hero name (outlined neon, filled up to the playhead) ---- */
const lines = CONFIG.name.trim().split(/\s+/).map(w => `<span class="ln">${esc(w)}</span>`).join("");
$('#nameOutline').innerHTML = lines;
$('#nameSolid').innerHTML = lines;

/* ---- timeline ---- */
const stage = $('#stage'), flag = $('#flag'), tl = $('#tl');
const rng = (seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296)(11);

$('#ruler').innerHTML = [0,5,10,15,20,25,30].map(s => `<span>0:${String(s).padStart(2,'0')}</span>`).join("");

function fillClips(el, minW, maxW, cap) {
  let total = 0, html = "", i = 0;
  while (total < 100) {
    const w = minW + rng() * (maxW - minW);
    if (cap) {
      const isGap = i % 2 === 0;
      html += `<span class="${isGap ? 'gap' : 'cap'}" style="flex:${w.toFixed(2)} 1 0"></span>`;
    } else {
      html += `<span class="clip ${rng() > .45 ? 'a' : 'b'}" style="flex:${w.toFixed(2)} 1 0"></span>`;
    }
    total += w; i++;
  }
  el.innerHTML = html;
}
fillClips($('#tV'), 8, 26, false);
fillClips($('#tC'), 3, 11, true);

const BAR_COUNT = 96;
$('#tA').innerHTML = Array.from({ length: BAR_COUNT }, (_, i) => {
  const h = 22 + 78 * Math.abs(Math.sin(i * .33) + Math.sin(i * .11 + 1)) / 2 * (.55 + .45 * rng());
  return `<span class="bar" style="--h:${h.toFixed(0)}%"></span>`;
}).join("");
const bars = [...document.querySelectorAll('#tA .bar')];
let lastK = -1;

function setP(p) {
  p = Math.min(100, Math.max(0, p));
  stage.style.setProperty('--p', p + '%');
  const t = p / 100 * 30, s = Math.floor(t), f = Math.floor((t - s) * 30);
  flag.textContent = `00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
  const k = Math.round(p / 100 * BAR_COUNT);
  if (k !== lastK) { bars.forEach((b, i) => b.classList.toggle('on', i < k)); lastK = k; }
  tl.setAttribute('aria-valuenow', Math.round(p));
  return p;
}

let cur = 64, touched = false, dragging = false;
const REST = 64;
const fromEvent = e => { const r = stage.getBoundingClientRect(); cur = setP((e.clientX - r.left) / r.width * 100); };

stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { touched = true; fromEvent(e); } });
stage.addEventListener('pointermove',  e => { if (e.pointerType === 'mouse' || dragging) { touched = true; fromEvent(e); } });
stage.addEventListener('pointerdown',  e => { if (e.pointerType !== 'mouse') { dragging = true; touched = true; fromEvent(e); } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
tl.addEventListener('keydown', e => {
  const step = { ArrowLeft: -3, ArrowRight: 3 }[e.key];
  if (step) { e.preventDefault(); touched = true; cur = setP(cur + step); }
  if (e.key === 'Home') { e.preventDefault(); touched = true; cur = setP(0); }
  if (e.key === 'End')  { e.preventDefault(); touched = true; cur = setP(100); }
});

// The one intro moment: the playhead sweeps across once and renders the name.
if (reduce) {
  setP(REST);
} else {
  setP(0);
  const t0 = performance.now(), DUR = 2400;
  (function step(now) {
    if (touched) return;
    const k = Math.min(1, (now - t0) / DUR);
    cur = setP(REST * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---- section headings ---- */
$('#workTitle').textContent = CONFIG.work.title;
$('#workLead').textContent = CONFIG.work.lead;
$('#servicesTitle').textContent = CONFIG.services.title;
$('#servicesLead').textContent = CONFIG.services.lead;
$('#aboutTitle').textContent = CONFIG.about.title;
$('#contactTitle').textContent = CONFIG.contact.title;
$('#contactLead').textContent = CONFIG.contact.lead;

/* ---- work grid ---- */
const projects = CONFIG.work.projects;
const art = i => {
  const x = 18 + ((i * 29) % 64), y = 8 + ((i * 17) % 38), a = (i * 53) % 360, m = 34 + (i % 3) * 10;
  return `radial-gradient(120% 70% at ${x}% ${y}%,color-mix(in srgb,var(--accent) ${m}%,#050203) 0%,transparent 62%),linear-gradient(${a}deg,#1c0a0f,#050203 70%)`;
};
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';

function card(p, i) {
  const url = safeUrl(p.link);
  const inner = `<span class="art"></span><span class="tag">${esc(p.category)}</span><span class="play">${PLAY}</span>` +
    `<span class="info"><b>${esc(p.title)}</b><small>${esc(p.meta)}</small></span><span class="bar-p"></span>`;
  const style = `style="--art:${art(i)};--w:${20 + ((i * 37) % 70)}%"`;
  return url
    ? `<a class="card" ${style} href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="Watch ${esc(p.title)}">${inner}</a>`
    : `<div class="card" ${style}>${inner}</div>`;
}
function renderGrid(cat) {
  $('#grid').innerHTML = projects.map((p, i) => (cat === 'All' || p.category === cat) ? card(p, i) : "").join("");
}
const cats = ['All', ...new Set(projects.map(p => p.category))];
$('#filters').innerHTML = cats.map((c, i) => `<button class="filter" type="button" data-cat="${esc(c)}" aria-pressed="${i === 0}">${esc(c)}</button>`).join("");
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('.filter'); if (!b) return;
  document.querySelectorAll('.filter').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderGrid(b.dataset.cat);
});
if (cats.length < 3) $('#filters').style.display = 'none';
renderGrid('All');

/* ---- services ---- */
$('#serviceRows').innerHTML = CONFIG.services.items.map(s =>
  `<div class="row"><h3>${esc(s.name)}</h3><p>${esc(s.text)}</p></div>`).join("");

/* ---- about ---- */
const photo = String(CONFIG.about.photo || "").startsWith("data:image/") ? `<figure class="photo"><img src="${esc(CONFIG.about.photo)}" alt="${esc(CONFIG.name)}"></figure>` : "";
$('#aboutMain').innerHTML = photo + `<p>${esc(CONFIG.about.text)}</p>`;
$('#facts').innerHTML = CONFIG.about.facts.map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");

/* ---- contact ---- */
$('#contactRows').innerHTML = CONFIG.contact.links.filter(l => safeUrl(l.url)).map(l =>
  `<a class="row" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer"><h3>${esc(l.label)}</h3><span class="val">${esc(l.value)}</span></a>`).join("");
</script>
</body>
</html>
